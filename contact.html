<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TMAN Operations - Contact</title>
</head>
<body>
    <header>
        <nav>
            <a href="index.html">Home</a> |
            <a href="about.html">About</a> |
            <a href="service.html">Services</a> |
            <a href="contact.html">Contact</a> |
            <a href="enquiry.html">Enquiry</a>
        </nav>
        <hr>
    </header>
    <main>
        <center><h1>Contact Form</h1></center>
        <center><form action="#" method="post">
            <label for="firstName">First Name:</label>
            <input type="text" id="firstName" name="firstName" required placeholder="Name" autocomplete="given-name"><br><br>
            <label for="lastName">Last Name:</label>
            <input type="text" id="lastName" name="lastName" required placeholder="Surname" autocomplete="family-name"><br><br>
            <label for="address">Address:</label>
            <input type="text" id="address" name="address" required placeholder="Address" autocomplete="address-line1"><br><br>
            <label for="email">Email:</label>
            <input type="email" id="email" name="email" required placeholder="email" autocomplete="email"><br><br>
            <label for="telephone">Telephone:</label>
            <input type="tel" id="telephone" name="telephone" required placeholder="phone number" autocomplete="tel"><br><br>
            <label for="question">Ask a question:</label>
            <input type="text" id="question" name="question" required placeholder="Does TMAN operations operate everyday or there are specific operation days?"><br><br>
            <input type="submit" value="Submit">
        </form></center>
    </main>
</body>
</html>
