<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enquiry</title>
    <link rel="stylesheet" href="CSS/styles.css">
    <meta name="description" content="Send an enquiry to TMAN Operations">
</head>
<body>
    <header class="site-header">
        <div class="container header-inner">
            <a class="brand" href="index.html">
                <span class="logo" aria-hidden="true"></span>
                <h1>TMAN Operations</h1>
            </a>
            <nav class="main-nav" aria-label="Main navigation">
                <a href="index.html">Home</a>
                <a href="about.html">About</a>
                <a href="service.html">Services</a>
                <a href="contact.html">Contact</a>
                <a href="enquiry.html">Enquiry</a>
            </nav>
        </div>
    </header>

    <main class="site-main">
        <div class="container">
            <section class="hero">
                <h1>Enquiry</h1>
                <p>Fill in the form below and we'll get back to you promptly.</p>
            </section>

            <section class="card">
                <form class="contact-form">
                    <label>First Name</label>
                    <input type="text" required placeholder="Name">

                    <label>Last Name</label>
                    <input type="text" required placeholder="Surname">

                    <label>Address</label>
                    <input type="text" required placeholder="Address">

                    <label>Email</label>
                    <input type="email" required placeholder="email">

                    <label>Telephone</label>
                    <input type="tel" required placeholder="phone number">

                    <label>Details</label>
                    <textarea required placeholder="detail your enquiry here"></textarea>

                    <input type="submit" value="Send Enquiry">
                </form>
            </section>
        </div>
    </main>

    <footer class="site-footer">
        <div class="container">
            <p>We aim to reply within 24 hours.</p>
        </div>
    </footer>
</body>
</html>
